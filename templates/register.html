{% extends "base.html" %}{% block title %}Register · SAS{% endblock %}
{% block content %}
<section class="auth-card"><h1>Create customer account</h1>
<form method="post">
<label>Full name</label><input name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Password (at least 4 characters)</label><input type="password" name="password" minlength="4" required>
<button class="btn full">Register</button>
</form><p class="center">Already registered? <a href="{{ url_for('login') }}">Login</a></p></section>
{% endblock %}
